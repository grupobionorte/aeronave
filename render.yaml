# Blueprint da Aeronave, no plano gratuito.
# ATENCAO: o plano free nao tem disco persistente. O banco SQLite fica no
# disco temporario e e APAGADO a cada deploy/reinicio (o servico tambem
# dorme apos ~15 min sem acesso). Serve para testar, nao para dados reais.
# Para guardar dados: plan: starter + bloco "disk" (mountPath /var/data) e
# DATA_DIR=/var/data.
services:
  - type: web
    name: aeronave
    runtime: node
    plan: free
    buildCommand: echo "sem dependencias"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
